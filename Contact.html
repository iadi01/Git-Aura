<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support | GitAura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #020617;
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: white; overflow-x: hidden; }
        .aura-font { font-family: 'Orbitron', sans-serif; }
        
        /* Animated Background Mesh */
        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: 
                radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);
        }

        /* Neon Glass Effect */
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: border 0.3s ease;
        }
        .glass-card:hover { border-color: rgba(99, 102, 241, 0.3); }

        /* Modern Inputs */
        .input-group input, .input-group textarea {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-group input:focus, .input-group textarea:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
            outline: none;
        }

        .glow-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .glow-btn:hover {
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }
        
        .nav-link { position: relative; }
        .nav-link::after {
            content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 1px;
            background: var(--primary); transition: width 0.3s ease;
        }
        .nav-link:hover::after { width: 100%; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">
    <div class="bg-mesh"></div>

    <header class="w-full max-w-6xl flex justify-between items-center p-6">
        <div class="aura-font font-black text-xl tracking-tighter bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
            GITAURA
        </div>
        <a href="index.html" class="text-[10px] font-bold uppercase tracking-widest text-slate-400 hover:text-white transition-all">
            ← Back To App
        </a>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center w-full px-6 py-12">
        <div class="max-w-4xl w-full grid grid-cols-1 lg:grid-cols-5 gap-8">
            
            <div class="lg:col-span-2 space-y-6">
                <h1 class="aura-font text-5xl font-black leading-none bg-gradient-to-br from-white to-slate-500 bg-clip-text text-transparent">
                    LET'S <br>TALK.
                </h1>
                <p class="text-slate-400 font-light text-sm max-w-xs">
                    Facing issues with your Aura ranking or want to suggest a new feature? Our team is active 24/7.
                </p>

                <div class="space-y-4 pt-6">
                    <div class="flex items-center gap-4 group cursor-pointer">
                        <div class="w-10 h-10 rounded-full bg-indigo-500/10 flex items-center justify-center border border-indigo-500/20 group-hover:bg-indigo-500/20 transition-all">
                            <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        </div>
                        <div>
                            <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Email Support</p>
                            <p >
                             <a href="mailto:adijsr5@gmail.com"class="text-sm font-semibold text-slate-200" rel="noreferrer">adijsr5@gmail.com</a>
                        </p></div>
                    </div>

                    <div class="flex items-center gap-4 group cursor-pointer">
                        <div class="w-10 h-10 rounded-full bg-purple-500/10 flex items-center justify-center border border-purple-500/20 group-hover:bg-purple-500/20 transition-all">
                            <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                        </div>
                        <div>
                            <p  class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Open Source</p>
                            <a  href="https://github.com/iadi01" class="text-sm font-semibold text-slate-200">github.com/git-aura</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-3">
                <div class="glass-card p-8 md:p-10 rounded-[32px] relative overflow-hidden">
                    <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-500/10 blur-[80px]"></div>

                    <form action="https://api.web3forms.com/submit" method="POST" class="space-y-6">
                        <input type="hidden" name="access_key" value="55f5cf1e-2244-434e-8aaf-c351d4f41f42" />
                        <input type="hidden" name="from_name" value="GitAura Support" />
                        <input type="hidden" name="redirect" value="https://web3forms.com/success">

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="input-group">
                                <label>Your Name</label>
                                <input type="text" name="name" placeholder="Nihal" required class="w-full p-4 rounded-2xl">
                            </div>
                            <div class="input-group">
                                <label>Email Address</label>
                                <input type="email" name="email" placeholder="Nihaln@github.com" required class="w-full p-4 rounded-2xl">
                            </div>
                        </div>

                        <div class="input-group">
                            <label>Detailed Message</label>
                            <textarea name="message" rows="5" placeholder="Tell us what's on your mind..." required class="w-full p-4 rounded-2xl resize-none"></textarea>
                        </div>

                        <button type="submit" class="glow-btn w-full bg-gradient-to-r from-indigo-600 to-purple-600 py-5 rounded-2xl font-black uppercase tracking-[0.3em] text-[11px]">
                            Dispatch Message
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full p-8 border-t border-white/5">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <p class="text-[10px] text-slate-600 font-medium uppercase tracking-widest italic">
                © 2026 GitAura pro. All Rights Reserved.
            </p>
            <nav class="flex gap-8 text-[9px] font-bold uppercase tracking-[0.2em] text-slate-500">
                <a href="index.html" class="nav-link hover:text-white transition-colors">Home</a>
                <a href="about-us.html" class="nav-link hover:text-white transition-colors">About</a>
                <a href="privacy-policy.html" class="nav-link hover:text-white transition-colors">Privacy</a>
                <a href="disclaimer.html" class="nav-link hover:text-white transition-colors">Disclaimer</a>
            </nav>
        </div>
    </footer>
</body>
</html>
