<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>GitAura | GitHub Profile Analyzer & Developer Rank Tool</title>
    <meta name="description" content="Analyze GitHub stats instantly. GitAura generates custom GitHub Aura cards, tracks contribution ranks, and visualizes developer identity for README profiles.">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "GitAura Pro",
      "operatingSystem": "Web",
      "applicationCategory": "DeveloperApplication",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "reviewCount": "2500"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://cdn.tailwindcss.com" as="script">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
    
    <link rel="stylesheet" href="style.css" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    
    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                var gt = document.createElement('script');
                gt.src = "https://www.googletagmanager.com/gtag/js?id=G-YMG5CV5LKP";
                gt.async = true;
                document.head.appendChild(gt);
                
                window.dataLayer = window.dataLayer || [];
                function gtag(){dataLayer.push(arguments);}
                gtag('js', new Date());
                gtag('config', 'G-YMG5CV5LKP');
            }, 4000); 
        });
    </script>
</head>

<body class="min-h-screen flex flex-col items-center p-7">
    <div class="bg-mesh"></div>

    <header class="w-full max-w-4xl flex justify-between items-center p-6 z-50">
        <div class="aura-font font-black text-2xl tracking-tighter text-indigo-400">
            GitAURA <span class="text-white opacity-50 text-sm italic">PRO</span>
        </div>
        <a href="leetaura.html" class="text-[9px] font-bold uppercase tracking-widest text-slate-400 border border-white/10 px-4 py-2 rounded-full hover:bg-white/5 hover:text-orange-400 transition-all duration-300 flex items-center gap-2">
            LEETAURA MODE <span class="opacity-50">↗</span>
        </a>
    </header>

    <main class="flex flex-col items-center mt-10 w-full max-w-4xl">
        <div class="text-center mb-8">
            <h1 class="aura-font text-5xl md:text-6xl font-black tracking-tighter glow-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent italic">
                GitAURA
            </h1>
            <p class="text-slate-400 font-light mt-2 tracking-widest uppercase text-xs">
                Ultimate GitHub Profile Analyzer & Developer Identity Card
            </p>
        </div>

        <div class="w-full max-w-md flex flex-col gap-4 mb-10">
            <input type="text" id="username" placeholder="Enter GitHub Username..." class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all text-lg text-white"/>
            <button onclick="checkAura()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 py-4 rounded-xl font-bold uppercase tracking-widest shadow-2xl shadow-purple-500/20 active:scale-95 transition-transform text-white">
                Scan Profile Identity
            </button>
            <p id="error" class="text-red-400 text-center text-sm hidden">User not found or API limit reached.</p>
        </div>

        <div id="captureArea" class="hidden">
            <div class="gradient-border shadow-2xl">
                <div id="auraCard" class="glass-card p-10 w-full max-w-sm flex flex-col items-center text-center">
                    <div class="relative mb-6">
                        <img id="avatar" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="112" height="112" alt="Developer Profile" class="w-28 h-28 rounded-2xl border-2 border-white/20 p-1 shadow-2xl"/>
                        <div id="rankBadge" class="absolute -bottom-3 -right-3 bg-white text-black text-[10px] font-black px-3 py-1 rounded-md aura-font uppercase">LEVEL 0</div>
                    </div>
                    <h2 id="name" class="text-2xl font-bold tracking-tight mb-1 text-white">Developer</h2>
                    <p id="login" class="text-purple-400 text-sm font-medium mb-6">@github</p>
                    <div class="grid grid-cols-2 gap-8 w-full mb-8">
                        <div><span class="text-[10px] text-slate-500 uppercase font-bold tracking-tighter">Aura Score</span><span id="score" class="aura-font text-2xl text-white font-bold block">0000</span></div>
                        <div class="border-l border-white/10 pl-4"><span class="text-[10px] text-slate-500 uppercase font-bold tracking-tighter">Rank Status</span><span id="rankTitle" class="aura-font text-lg text-indigo-400 leading-tight block uppercase">ROOKIE</span></div>
                    </div>
                    <div class="w-full bg-white/5 rounded-lg py-3 px-4 mb-4 border border-white/5">
                        <p id="auraQuote" class="text-xs italic text-slate-300">"Analyzing code patterns..."</p>
                    </div>
                    <div class="flex gap-2 opacity-50 text-[10px] font-bold mb-4 text-white">
                        <span id="repoCount">0 REPOS</span> • <span id="followerCount">0 FOLLOWERS</span>
                    </div>
                    <div class="pt-4 border-t border-white/10 w-full">
                        <p class="text-[10px] tracking-widest text-slate-500 font-bold uppercase aura-font">Generated by <span class="text-indigo-400 italic">Git-AURA</span></p>
                    </div>
                </div>
            </div>
        </div>

        <button id="downloadBtn" onclick="downloadCard()" class="mt-8 hidden flex items-center gap-2 text-slate-400 hover:text-white transition-colors">
            Save GitAura Card
        </button>
    </main>

    <script>
    async function checkAura() {
        const usernameInput = document.getElementById('username');
        const username = usernameInput.value.trim();
        if (!username) return;

        const elements = {
            avatar: document.getElementById('avatar'),
            name: document.getElementById('name'),
            login: document.getElementById('login'),
            score: document.getElementById('score'),
            repoCount: document.getElementById('repoCount'),
            followerCount: document.getElementById('followerCount'),
            rankBadge: document.getElementById('rankBadge'),
            rankTitle: document.getElementById('rankTitle'),
            auraQuote: document.getElementById('auraQuote'),
            captureArea: document.getElementById('captureArea'),
            downloadBtn: document.getElementById('downloadBtn'),
            error: document.getElementById('error')
        };

        try {
            const res = await fetch(`https://api.github.com/users/${username}`);
            if (!res.ok) throw new Error("User not found");
            const data = await res.json();

            let score = (data.public_repos * 15) + (data.followers * 30) + (data.public_gists * 10);
            const yearsOld = new Date().getFullYear() - new Date(data.created_at).getFullYear() || 1;
            score += (yearsOld * 250);

            elements.avatar.src = data.avatar_url;
            elements.name.textContent = data.name || data.login;
            elements.login.textContent = `@${data.login}`;
            elements.score.textContent = score.toLocaleString();
            elements.repoCount.textContent = `${data.public_repos} REPOS`;
            elements.followerCount.textContent = `${data.followers} FOLLOWERS`;

            const rankLevels = [
                { min: 20000, rank: "DIVINE ARCHITECT", quote: "You have transcended the digital reality." },
                { min: 15000, rank: "OMNIPOTENT", quote: "The binary world bows to your command." },
                { min: 12000, rank: "GALAXY CONQUEROR", quote: "Your repositories span across the stars." },
                { min: 10000, rank: "ZENITH", quote: "The peak of human logic and creativity." },
                { min: 9000, rank: "GIT GOD", quote: "The ultimate architect of the digital universe." },
                { min: 8000, rank: "ETHEREAL", quote: "Floating above the common codebase." },
                { min: 7000, rank: "CELESTIAL", quote: "Your code shines brighter than a thousand stars." },
                { min: 6000, rank: "IMMORTAL", quote: "Bugs fear your name across generations." },
                { min: 5000, rank: "MYTHIC", quote: "A living legend in the world of bits and bytes." },
                { min: 0, rank: "POOKIE", quote: "New to the game, but the potential is huge!" }
            ];

            const { rank, quote } = rankLevels.find(level => score >= level.min) || rankLevels[rankLevels.length - 1];

            elements.rankBadge.textContent = `LEVEL ${yearsOld}`;
            elements.rankTitle.textContent = rank;
            elements.auraQuote.textContent = `"${quote}"`;

            elements.captureArea.classList.remove('hidden');
            elements.downloadBtn.classList.remove('hidden');
            elements.error.classList.add('hidden');

        } catch (err) {
            elements.error.classList.remove('hidden');
            elements.captureArea.classList.add('hidden');
            elements.downloadBtn.classList.add('hidden');
        }
    }

    function downloadCard() {
        const area = document.getElementById('captureArea');
        if (!area) return;

        html2canvas(area, {
            backgroundColor: "#020617",
            scale: 2,
            useCORS: true,
            logging: false
        }).then(canvas => {
            const link = document.createElement('a');
            const login = document.getElementById('login').innerText || 'user';
            link.download = `GitAura-${login}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }
    </script>
</body>
</html>
